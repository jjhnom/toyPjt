name: Build Pixel Fantasy APK

on:
  push:
    branches: [main, master]
    paths: ['rnd/**', '.github/workflows/build-apk.yml']
  pull_request:
    branches: [main, master]
    paths: ['rnd/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: rnd

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rnd/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Test summoning and combination
        run: npm test

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build Web Bundle (Vite + TypeScript)
        run: npm run build

      - name: Sync Capacitor Android Platform
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: rnd/android
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: rnd/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: summoners-expedition-debug-apk
          path: rnd/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
