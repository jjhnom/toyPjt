name: Build Coloring Day APK

on:
  push:
    branches: [main]
    paths:
      - 'teeniepingDarw/**'
      - '.github/workflows/coloring-day-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coloring-day-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: teeniepingDarw

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: teeniepingDarw/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: npm run check

      - name: Test offline app
        run: npm test

      - name: Bundle all drawings
        run: npm run build:mobile

      - name: Sync Android
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: teeniepingDarw/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK and checksum
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/coloring-day.apk
          cd artifacts
          sha256sum coloring-day.apk > coloring-day.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coloring-day-apk
          path: teeniepingDarw/artifacts/*
          if-no-files-found: error
          retention-days: 14
